<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事件ニュースフィード</title>
<style>
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 1.4rem; border-bottom: 2px solid #333; padding-bottom: 8px; }
  #loading { text-align: center; padding: 60px 0; color: #666; }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 16px;
    border: 4px solid #ddd; border-top-color: #333;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .item {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .item .category { font-size: 0.75rem; color: #888; }
  .item .location { font-weight: bold; margin: 4px 0; }
  .item .statement { margin: 8px 0; line-height: 1.6; }
  .item .source { font-size: 0.8rem; color: #666; margin-top: 8px; }
  .item .source a { color: #06c; }
  #error { display: none; color: #b00; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <h1>事件ニュースフィード(直近5件)</h1>

  <div id="loading">
    <div class="spinner"></div>
    しばらくお待ちください…
  </div>

  <div id="error">
    データの取得に失敗しました。時間をおいて再度お試しください。
  </div>

  <div id="results"></div>

  <script>
    // Firebase Hosting の rewrite 経由で /api/news に来るように設定する想定
    // (firebase.json の rewrites を参照)
    const ENDPOINT = "/api/news";

    async function loadFeed() {
      const loadingEl = document.getElementById("loading");
      const errorEl = document.getElementById("error");
      const resultsEl = document.getElementById("results");

      try {
        const res = await fetch(ENDPOINT);
        if (!res.ok) throw new Error("Bad response: " + res.status);
        const data = await res.json();

        loadingEl.style.display = "none";

        if (!data.items || data.items.length === 0) {
          resultsEl.innerHTML = "<p>現在表示できる事案はありません。</p>";
          return;
        }

        resultsEl.innerHTML = data.items.map(renderItem).join("");
      } catch (err) {
        loadingEl.style.display = "none";
        errorEl.style.display = "block";
        console.error(err);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function renderItem(item) {
      return `
        <div class="item">
          <div class="category">${escapeHtml(item.category)}</div>
          <div class="location">${escapeHtml(item.location)}</div>
          <div>${escapeHtml(item.summary)}</div>
          ${item.statement_summary ? `<div class="statement">${escapeHtml(item.statement_summary)}</div>` : ""}
          <div class="source">
            引用元:
            <a href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener">${escapeHtml(item.source_name)}</a>
          </div>
        </div>
      `;
    }

    loadFeed();
  </script>
</body>
</html>
